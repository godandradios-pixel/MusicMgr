# Builds a MusicMgr release when a version tag is pushed, e.g.:
#   git tag v1.5.0 && git push origin v1.5.0
#
# Produces a DRAFT release with:
#   MusicMgr-<ver>-windows-x64.exe, MusicMgr-<ver>-linux-x86_64, SHA256SUMS.txt
# Drafts are invisible to the in-app updater. Sign and publish it from your PC:
#   python tools/sign_release.py v1.5.0
# (The signing key never lives on GitHub - see tools/make_signing_key.py.)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag must match musicmgr/__init__.py
        id: version
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('musicmgr/__init__.py').read()).group(1))")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match __version__ = $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Qt runtime libraries (headless tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 libpulse0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build.ps1 stamps the commit into VERSION
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        shell: pwsh
        run: .\build.ps1 -SkipPull -NoPause
      - name: Rename
        shell: pwsh
        run: Move-Item dist\MusicMgr.exe "dist\MusicMgr-${{ needs.test.outputs.version }}-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/MusicMgr-*-windows-x64.exe
          if-no-files-found: error

  build-linux:
    needs: test
    # oldest supported base on purpose: a binary built against glibc 2.35
    # runs on Mint 21.x (Ubuntu 22.04) and Mint 22.x (Ubuntu 24.04) alike
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Qt build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libglib2.0-0 libpulse0 libxcb-cursor0
      - run: bash build.sh
      - run: mv dist/MusicMgr "dist/MusicMgr-${{ needs.test.outputs.version }}-linux-x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/MusicMgr-*-linux-x86_64
          if-no-files-found: error

  draft-release:
    needs: [test, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: |
          chmod +x MusicMgr-*-linux-x86_64
          sha256sum MusicMgr-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          PRE=""
          if echo "$VERSION" | grep -Eq '(a|b|rc)[0-9]+$'; then PRE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft $PRE \
            --title "MusicMgr $VERSION" \
            --generate-notes
