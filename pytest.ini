[pytest]
# Makes "musicmgr" importable no matter how pytest is invoked (bare `pytest`,
# `python -m pytest`, or from an IDE) - `.` is this file's own folder, i.e.
# the repo root that `run.py` and `musicmgr/` both live in.
pythonpath = .
testpaths = tests
# If one test is stuck for 2 minutes, print every thread's stack so the log
# shows where it's waiting (the run carries on; CI's own limit stops it).
faulthandler_timeout = 120
# 2026-10-19: ...and if it's still stuck at 3 minutes, fail it (pytest-timeout).
# The audio player has hung now and then in PlayerController.stop() and
# _advance_to_standby (seen 10/01, 10/04, 10/17); without this a hang
# stalled a release build until CI's own job limit. "thread" because a hang
# inside Qt's C++ code never returns to Python for a signal to land; it
# dumps every thread's stack and ends the run.
timeout = 180
timeout_method = thread
